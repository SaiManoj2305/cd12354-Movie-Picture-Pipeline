name: Frontend Continuous Delivery

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: us-east-1
  CLUSTER_NAME: cluster
  ECR_REPOSITORY: 734087413977.dkr.ecr.us-east-1.amazonaws.com/frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test
        run: npm run test -- --watchAll=false

  deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        working-directory: starter/frontend
        env:
          IMAGE_TAG: ${{ github.sha }}
          REACT_APP_MOVIE_API_URL: "http://a055ebb48399047cbb8b2f38ed36122c-782230703.us-east-1.elb.amazonaws.com"
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REPOSITORY:latest .
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:latest

      - name: Set up Kubeconfig
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_DEFAULT_REGION

      - name: Deploy to EKS
        working-directory: starter/frontend/k8s
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kustomize edit set image frontend=$ECR_REPOSITORY:$IMAGE_TAG
          kustomize build . | kubectl apply --validate=false -f -
          kubectl rollout status deployment/frontend -n default --timeout=180s

      - name: Verify Frontend Deployment and Pods
        run: |
          echo "=== Frontend Pod Status ==="
          kubectl get pods -l app=frontend -o wide
          echo "=== Frontend Service Status ==="
          kubectl get service frontend -o wide

      - name: Output Frontend Service URL
        run: |
          echo "=== Frontend LoadBalancer Ingress DNS ==="
          kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""
